name: Validate published APT repository

on:
  pull_request:
    paths:
      - '.github/workflows/validate-published-apt.yml'
      - 'install-apt.sh'
      - 'docs/apt-repository.md'
      - 'packaging/debian/README.md'
      - 'packaging/debian/apt-index.html'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-published-apt.yml'
      - 'install-apt.sh'
      - 'docs/apt-repository.md'
      - 'packaging/debian/README.md'
      - 'packaging/debian/apt-index.html'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: Optional published package version to assert; defaults to the live candidate
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  APT_REPOSITORY_URL: https://zevarix.github.io/pantheon-local-tools
  APT_PRIMARY_FINGERPRINT: B75C45FA9E87AF56D7677F5785AF0D1C6E64C3F2

jobs:
  public-apt:
    runs-on: ubuntu-latest

    steps:
      - name: Install validation prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ca-certificates curl gnupg

      - name: Resolve validation target
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version=${DISPATCH_VERSION:-}
          if [ -n "$version" ]; then
            dpkg --validate-version "$version"
          fi
          printf 'EXPECTED_PACKAGE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Download and verify archive key
        shell: bash
        run: |
          set -euo pipefail

          keyring="$RUNNER_TEMP/pantheon-local-tools-archive-keyring.gpg"
          curl --fail --silent --show-error --location \
            "$APT_REPOSITORY_URL/pantheon-local-tools-archive-keyring.gpg" \
            --output "$keyring"

          fingerprint=$(
            gpg --batch --show-keys --with-colons "$keyring" |
              awk -F: '$1 == "fpr" && !found { print $10; found = 1 }'
          )

          [ "$fingerprint" = "$APT_PRIMARY_FINGERPRINT" ] || {
            printf 'expected archive fingerprint %s, got %s\n' \
              "$APT_PRIMARY_FINGERPRINT" "$fingerprint" >&2
            exit 1
          }

          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 \
            "$keyring" \
            /etc/apt/keyrings/pantheon-local-tools.gpg

      - name: Configure repository and discover package
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/pantheon-local-tools.sources" <<EOF
          Types: deb
          URIs: $APT_REPOSITORY_URL
          Suites: stable
          Components: main
          Architectures: all
          Signed-By: /etc/apt/keyrings/pantheon-local-tools.gpg
          EOF

          sudo install -m 0644 \
            "$RUNNER_TEMP/pantheon-local-tools.sources" \
            /etc/apt/sources.list.d/pantheon-local-tools.sources

          apt_output=$(sudo apt-get update 2>&1)
          printf '%s\n' "$apt_output"
          case "$apt_output" in
            *"doesn't support architecture"*)
              echo 'APT emitted an unsupported-architecture notice' >&2
              exit 1
              ;;
          esac

          candidate=$(
            apt-cache policy pantheon-local-tools |
              awk '/Candidate:/ && !found { print $2; found = 1 }'
          )

          [ -n "$candidate" ] && [ "$candidate" != '(none)' ] || {
            echo 'published repository did not expose a package candidate' >&2
            exit 1
          }
          dpkg --validate-version "$candidate"

          if [ -n "${EXPECTED_PACKAGE_VERSION:-}" ] && \
             [ "$candidate" != "$EXPECTED_PACKAGE_VERSION" ]; then
            printf 'expected candidate %s, got %s\n' \
              "$EXPECTED_PACKAGE_VERSION" "$candidate" >&2
            exit 1
          fi

          printf 'PACKAGE_VERSION=%s\n' "$candidate" >> "$GITHUB_ENV"

      - name: Install and verify published package
        shell: bash
        run: |
          set -euo pipefail

          ! dpkg-query -W -f='${Status}\n' pantheon-local-tools 2>/dev/null |
            grep -qx 'install ok installed'
          [ ! -e /usr/bin/pantheon-local ]

          sudo apt-get install --yes \
            "pantheon-local-tools=$PACKAGE_VERSION"

          [ "$(dpkg-query -W -f='${Version}' pantheon-local-tools)" = \
            "$PACKAGE_VERSION" ]
          [ "$(/usr/bin/pantheon-local --version)" = \
            "pantheon-local $PACKAGE_VERSION" ]
          [ "$(readlink -f /usr/bin/pantheon-local)" = \
            '/usr/lib/pantheon-local-tools/bin/pantheon-local' ]

      - name: Verify reinstall and configuration preservation
        shell: bash
        run: |
          set -euo pipefail

          config="$RUNNER_TEMP/pantheon-local-tools-config"
          PANTHEON_LOCAL_CONFIG="$config" \
            /usr/bin/pantheon-local config set provider ddev

          [ "$(
            PANTHEON_LOCAL_CONFIG="$config" \
              /usr/bin/pantheon-local config get provider
          )" = 'ddev' ]

          sudo apt-get install --yes --reinstall \
            "pantheon-local-tools=$PACKAGE_VERSION"

          [ "$(
            PANTHEON_LOCAL_CONFIG="$config" \
              /usr/bin/pantheon-local config get provider
          )" = 'ddev' ]
          [ -f "$config" ]

      - name: Verify uninstall and user-state preservation
        shell: bash
        run: |
          set -euo pipefail

          config="$RUNNER_TEMP/pantheon-local-tools-config"
          sudo apt-get remove --yes pantheon-local-tools
          hash -r

          ! dpkg-query -W -f='${Status}\n' pantheon-local-tools 2>/dev/null |
            grep -qx 'install ok installed'
          [ ! -e /usr/bin/pantheon-local ]
          [ ! -e /usr/lib/pantheon-local-tools ]
          ! type -P pantheon-local >/dev/null 2>&1
          [ -f "$config" ]
          [ "$(git config --file "$config" --get local.provider)" = 'ddev' ]

      - name: Remove validation APT source
        if: always()
        shell: bash
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/pantheon-local-tools.sources \
            /etc/apt/keyrings/pantheon-local-tools.gpg

  one-command-install:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Seed isolated shell startup files
        shell: bash
        run: |
          set -euo pipefail

          shell_home="$RUNNER_TEMP/pantheon-local-tools-shell-home"
          snapshot="$RUNNER_TEMP/pantheon-local-tools-shell-before"
          mkdir -p "$shell_home" "$snapshot"

          for rc in \
            .bashrc .bash_profile .bash_login .profile \
            .zshenv .zprofile .zshrc .zlogin .zlogout; do
            printf 'sentinel:%s\n' "$rc" > "$shell_home/$rc"
            cp "$shell_home/$rc" "$snapshot/$rc"
          done

          printf 'APT_TEST_HOME=%s\n' "$shell_home" >> "$GITHUB_ENV"
          printf 'APT_SHELL_SNAPSHOT=%s\n' "$snapshot" >> "$GITHUB_ENV"

      - name: Install through the one-command APT bootstrap
        shell: bash
        run: |
          set -euo pipefail
          install_output=$(HOME="$APT_TEST_HOME" bash ./install-apt.sh 2>&1)
          printf '%s\n' "$install_output"
          case "$install_output" in
            *"doesn't support architecture"*)
              echo 'one-command install emitted an unsupported-architecture notice' >&2
              exit 1
              ;;
          esac

      - name: Verify bootstrap result
        shell: bash
        run: |
          set -euo pipefail

          [ -r /etc/apt/keyrings/pantheon-local-tools.gpg ]
          [ -r /etc/apt/sources.list.d/pantheon-local-tools.sources ]
          grep -Fq \
            'Architectures: all' \
            /etc/apt/sources.list.d/pantheon-local-tools.sources
          grep -Fq \
            'Signed-By: /etc/apt/keyrings/pantheon-local-tools.gpg' \
            /etc/apt/sources.list.d/pantheon-local-tools.sources
          dpkg-query -W -f='${Status}\n' pantheon-local-tools |
            grep -qx 'install ok installed'
          /usr/bin/pantheon-local --version

          for rc in \
            .bashrc .bash_profile .bash_login .profile \
            .zshenv .zprofile .zshrc .zlogin .zlogout; do
            cmp -s "$APT_SHELL_SNAPSHOT/$rc" "$APT_TEST_HOME/$rc" || {
              printf 'shell startup file changed during APT bootstrap: %s\n' \
                "$rc" >&2
              exit 1
            }
          done

      - name: Remove bootstrap validation state
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get remove --yes pantheon-local-tools || true
          sudo rm -f \
            /etc/apt/sources.list.d/pantheon-local-tools.sources \
            /etc/apt/keyrings/pantheon-local-tools.gpg

          for rc in \
            .bashrc .bash_profile .bash_login .profile \
            .zshenv .zprofile .zshrc .zlogin .zlogout; do
            cmp -s "$APT_SHELL_SNAPSHOT/$rc" "$APT_TEST_HOME/$rc" || {
              printf 'shell startup file changed during APT install/remove cycle: %s\n' \
                "$rc" >&2
              exit 1
            }
          done
