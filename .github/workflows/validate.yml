name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            bash -n "$file"
          done < <(find . -type f \
            \( -name '*.sh' -o -path './bin/*' \) \
            -not -path './.git/*' \
            -print)

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            shellcheck "$file"
          done < <(find . -type f \
            \( -name '*.sh' -o -path './bin/*' \) \
            -not -path './.git/*' \
            -print)

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.sh; do
            bash "$test"
          done
