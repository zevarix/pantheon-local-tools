name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \
            \( -name '*.sh' -o -path './bin/*' \) \
            -not -path './.git/*' \
            -print)

          if ((${#files[@]} == 0)); then
            echo 'No shell files to validate yet.'
            exit 0
          fi

          for file in "${files[@]}"; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f \
            \( -name '*.sh' -o -path './bin/*' \) \
            -not -path './.git/*' \
            -print)

          if ((${#files[@]} == 0)); then
            echo 'No shell files to lint yet.'
            exit 0
          fi

          shellcheck "${files[@]}"
