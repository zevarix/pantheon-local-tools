name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ShellCheck on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck dpkg-dev gnupg

      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            bash -n "$file"
          done < <(find . -type f \
            \( -name '*.sh' -o -path './bin/*' -o -path './libexec/*' \) \
            -not -path './.git/*' \
            -print)

      - name: Run ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            shellcheck "$file"
          done < <(find . -type f \
            \( -name '*.sh' -o -path './bin/*' -o -path './libexec/*' \) \
            -not -path './.git/*' \
            -print)

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.sh; do
            bash "$test"
          done

  validate-powershell-release-harness:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse PowerShell release harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path 'packaging/release/validate-wsl2-apt-upgrade.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

          Write-Host 'PowerShell release harness syntax: PASS'
